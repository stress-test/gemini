name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/BB-Solver-debug.apk
          cd dist
          sha256sum BB-Solver-debug.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BB-Solver-APK
          path: |
            dist/BB-Solver-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/BB-Solver-debug.apk dist/SHA256SUMS.txt --clobber
            gh release edit latest \
              --title "BB Solver - Latest APK" \
              --notes "APK tự động build từ nhánh ${GITHUB_REF_NAME}. Tải BB-Solver-debug.apk để cài trên Android."
          else
            gh release create latest \
              dist/BB-Solver-debug.apk dist/SHA256SUMS.txt \
              --title "BB Solver - Latest APK" \
              --notes "APK tự động build từ nhánh ${GITHUB_REF_NAME}. Tải BB-Solver-debug.apk để cài trên Android."
          fi
